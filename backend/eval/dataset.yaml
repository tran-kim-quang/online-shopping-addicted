# Shop QA Agent Evaluation Dataset (30 cases: 26 Vietnamese + 4 English)
# Sources correspond to deterministic seeds in eval/seed.py:
#   - shop_tiki_trading: Tiki Trading shop (6 products)
#   - product_gao_st25: Gạo ST25 Harmony Vinh Hiển 5KG (external_id 277880353)

# --- Shop ranking & filtering (PLAN acceptance #3, #4 + filters/comparisons) ---

- id: shop-top-sold-3
  source: shop_tiki_trading
  question: "Top 3 sản phẩm bán chạy nhất của shop là gì?"
  expect_tools: [query_products]
  expect_args: {sort_by: sold_count}
  checks:
    - {type: ordered_products, by: sold_count, order: desc, n: 3}
    - {type: has_citation, ref_type: P}
    - {type: no_invalid_citations}
    - {type: numbers_grounded}
    - {type: language, lang: vi}

- id: shop-top-sold-1
  source: shop_tiki_trading
  question: "Sản phẩm nào bán chạy nhất trong shop?"
  expect_tools: [query_products]
  expect_args: {sort_by: sold_count}
  checks:
    - {type: ordered_products, by: sold_count, order: desc, n: 1}
    - {type: has_citation, ref_type: P}
    - {type: no_invalid_citations}
    - {type: numbers_grounded}

