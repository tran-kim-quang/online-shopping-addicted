x-backend-env: &backend-env
  DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://shopqa:shopqa@db:5432/shopqa}
  REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
  # Dev fallback key; override SECRET_KEY in .env for real deployments.
  SECRET_KEY: ${SECRET_KEY:-vN5y6rM0J9h2xL8qK3pW1zB4cF7dG0tH2sV5mN8wX4Q=}
  ALLOW_PRIVATE_LLM_HOSTS: ${ALLOW_PRIVATE_LLM_HOSTS:-true}
  ALLOW_PRIVATE_CRAWL_HOSTS: ${ALLOW_PRIVATE_CRAWL_HOSTS:-false}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  LLM_PROBE_TIMEOUT_SECONDS: ${LLM_PROBE_TIMEOUT_SECONDS:-20}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  LLM_REGISTRY_MAX_CLIENTS: ${LLM_REGISTRY_MAX_CLIENTS:-64}
  CRAWL_RATE_PER_SECOND: ${CRAWL_RATE_PER_SECOND:-1.0}
  CRAWL_MAX_RETRIES: ${CRAWL_MAX_RETRIES:-3}
  CRAWL_TIMEOUT_SECONDS: ${CRAWL_TIMEOUT_SECONDS:-20}
  CRAWL_MAX_PRODUCTS: ${CRAWL_MAX_PRODUCTS:-100}
  CRAWL_MAX_REVIEWS_PER_PRODUCT: ${CRAWL_MAX_REVIEWS_PER_PRODUCT:-200}
  CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-2}
  CRAWL_CACHE_TTL_HOURS: ${CRAWL_CACHE_TTL_HOURS:-48}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-local}
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
  SENTIMENT_BATCH_SIZE: ${SENTIMENT_BATCH_SIZE:-20}
  CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-1200}
  CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-150}
  HF_HOME: ${HF_HOME:-/models}
  JOB_HEARTBEAT_INTERVAL_SECONDS: ${JOB_HEARTBEAT_INTERVAL_SECONDS:-15}
  JOB_STALE_TIMEOUT_SECONDS: ${JOB_STALE_TIMEOUT_SECONDS:-120}
  JOB_QUEUED_TIMEOUT_SECONDS: ${JOB_QUEUED_TIMEOUT_SECONDS:-600}
  JOB_STREAM_MAX_SECONDS: ${JOB_STREAM_MAX_SECONDS:-3600}
  SEARCH_MIN_COSINE_SIMILARITY: ${SEARCH_MIN_COSINE_SIMILARITY:-0.6}
  AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
  AGENT_TOOL_RESULT_MAX_CHARS: ${AGENT_TOOL_RESULT_MAX_CHARS:-6000}
  AGENT_REVIEW_MAX_CHARS: ${AGENT_REVIEW_MAX_CHARS:-500}
  AGENT_HISTORY_MESSAGES: ${AGENT_HISTORY_MESSAGES:-10}
  AGENT_CRAWL_MAX_PER_TURN: ${AGENT_CRAWL_MAX_PER_TURN:-1}
  AGENT_CRAWL_MAX_PER_SESSION: ${AGENT_CRAWL_MAX_PER_SESSION:-3}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
  CHAT_SYSTEM_DAILY_PER_USER: ${CHAT_SYSTEM_DAILY_PER_USER:-3}
  CHAT_SYSTEM_DAILY_PER_IP: ${CHAT_SYSTEM_DAILY_PER_IP:-10}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopqa}
      POSTGRES_DB: ${POSTGRES_DB:-shopqa}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopqa} -d ${POSTGRES_DB:-shopqa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: shop-qa-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Not published on the host: all traffic goes through nginx, which is what makes
    # TRUST_PROXY_HEADERS safe (a direct client could otherwise forge X-Forwarded-For).
    expose:
      - "8000"
    volumes:
      - hf_cache:/models
    environment:
      <<: *backend-env
      TRUST_PROXY_HEADERS: "true"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    image: shop-qa-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - hf_cache:/models
    environment:
      <<: *backend-env
    command: ["arq", "app.jobs.worker.WorkerSettings"]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same origin: the browser calls /api/... on the nginx host.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    depends_on:
      - api
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}

  nginx:
    image: nginx:1.27.3-alpine
    depends_on:
      - api
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
    restart: unless-stopped

volumes:
  pgdata:
  hf_cache:
